<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر العلوم التفاعلي</title>
    <link rel="stylesheet" href="../css/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/ThreeD.css">
</head>
<body>

    <div class="lab-card">
        <header>
            <h1 id="main-title">تحميل المختبر...</h1>
            <div class="nav-tabs">
                <button onclick="switchOrganism('bacteria')" id="btn-bacteria" class="tab-btn active">خلية البكتيريا</button>
                <button onclick="switchOrganism('paramecium')" id="btn-paramecium" class="tab-btn">البراميسيوم</button>
                <button onclick="switchOrganism('spirogyra')" id="btn-spirogyra" class="tab-btn">السبيروجيرا</button>
            </div>
        </header>

        <main class="content-wrapper">
            <div class="model-side">
                <div class="embed-container"> 
                    <iframe id="model-iframe" title="Biology Model" frameborder="0" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking"></iframe> 
                </div>
            </div>

            <div class="quiz-side">
                <table class="science-table">
                    <thead>
                        <tr>
                            <th>الرقم</th>
                            <th>اسم الجزء (من المنهاج)</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="quizBody"></tbody>
                </table>
                <button class="btn-check" onclick="checkAnswers()">تحقق من إجاباتك ✅</button>
                
                <a href="../index.html" class="back-link">العودة للرئيسية</a>
            </div>
        </main>
    </div>

    <script src="../js/sweetalert2.all.min.js"></script>
    <script src="../js/ThreeD.js"></script>
</body>
</html>
