<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الكائنات الحية | المختبر العلمي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/name.css">
</head>

<body>

    <!-- خلفية الجسيمات -->
    <div class="bg-particles">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- شريط التنقل العلوي -->
    <nav class="top-nav">
        <a href="../index.html" class="nav-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M19 12H5M12 5l7 7-7 7" />
            </svg>
            <span>العودة للمختبر</span>
        </a>
        <div class="nav-brand">
            <div class="brand-icon">🔬</div>
            <span>محلل الكائنات الحية</span>
        </div>
    </nav>

    <main class="main-container">

        <!-- قسم التحليل -->
        <section class="analyzer-section">
            <div class="section-header">
                <div class="header-badge">
                    <span>🧬</span>
                    <p>محلل علمي متطور</p>
                </div>
                <h1>تحليل الكائنات الحية</h1>
                <p class="subtitle">ارفع صورة لأي كائن حي وسيقوم مختبرنا الذكي بتحليله علمياً بدقة عالية</p>
            </div>

            <!-- بطاقة الرفع -->
            <div class="upload-card" id="uploadCard">
                <input type="file" id="imageUpload" accept="image/*" hidden>
                <label for="imageUpload" class="upload-zone" id="uploadZone">
                    <div class="upload-icon-wrapper">
                        <div class="upload-icon-ring"></div>
                        <span class="upload-icon">📷</span>
                    </div>
                    <p class="upload-title">اختر صورة للتحليل</p>
                    <p class="upload-hint">يدعم JPG · PNG · WEBP · GIF</p>
                    <div class="upload-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                        </svg>
                        استعراض الصور
                    </div>
                </label>

                <!-- معاينة الصورة -->
                <div id="imagePreview" class="image-preview-container hidden">
                    <div class="preview-inner">
                        <img id="previewImg" src="" alt="معاينة الصورة">
                        <div class="preview-overlay">
                            <button class="change-image-btn" onclick="document.getElementById('imageUpload').click()">
                                🔄 تغيير الصورة
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- قسم النتائج -->
            <div id="resultSection" class="result-section hidden">
                <div class="result-header">
                    <div class="result-badge">✅ تم التحليل بنجاح</div>
                    <h2 id="res-commonName" class="result-title"></h2>
                    <div class="confidence-bar-wrapper" id="confidenceWrapper" style="display:none">
                        <span class="confidence-label">نسبة الثقة</span>
                        <div class="confidence-track">
                            <div class="confidence-fill" id="confidenceFill"></div>
                        </div>
                        <span class="confidence-value" id="confidenceValue"></span>
                    </div>
                </div>

                <div class="taxonomy-grid" id="taxonomyGrid"></div>

                <div class="notes-box" id="notesBox" style="display:none">
                    <div class="notes-icon">📝</div>
                    <div class="notes-content">
                        <h4>ملاحظات مخبرية</h4>
                        <p id="notesText"></p>
                    </div>
                </div>

                <button class="save-btn" id="saveBtn" onclick="saveToHistory()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    حفظ في سجل التحليلات
                </button>
            </div>
        </section>

        <!-- سجل التحليلات المحفوظة -->
        <section class="history-section" id="historySection">
            <div class="history-header">
                <h2>
                    <span>📚</span>
                    سجل التحليلات المحفوظة
                </h2>
                <button class="clear-history-btn" onclick="clearHistory()" id="clearBtn" style="display:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2" />
                    </svg>
                    مسح الكل
                </button>
            </div>
            <div class="history-grid" id="historyGrid">
                <div class="empty-history" id="emptyHistory">
                    <span class="empty-icon">🗂️</span>
                    <p>لا توجد تحليلات محفوظة بعد</p>
                    <small>ستظهر هنا بعد حفظ أول تحليل</small>
                </div>
            </div>
        </section>

    </main>

    <script src="../js/sweetalert2.all.min.js"></script>
    <script src="../js/script.js"></script>
</body>

</html>
